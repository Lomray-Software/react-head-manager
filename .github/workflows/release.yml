name: Release

on:
  push:
    branches: [ prod, staging ]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

env:
  NODE_VERSION: 22.23.2
  ENABLE_CACHE: yes

jobs:
  prepare:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-prepare
      cancel-in-progress: true
    outputs:
      node-version: ${{ steps.variable.outputs.node-version }}
      enable-cache: ${{ steps.variable.outputs.enable-cache }}

    steps:
      - name: Define variables
        id: variable
        run: |
          echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "enable-cache=$ENABLE_CACHE" >> $GITHUB_OUTPUT

  release:
    name: Release
    needs: [prepare]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}-release
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ needs.prepare.outputs.node-version }}
          cache: ${{ needs.prepare.outputs.enable-cache == 'yes' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run check typescript
        run: npm run ts:check

      - name: Run eslint
        run: npm run lint:check

      - name: Test
        run: npm run test -- --coverage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage

      - name: Build
        run: |
          npm pkg delete scripts.prepare
          npm run build

      - name: Release
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  sonarcube:
    runs-on: ubuntu-latest
    needs: [release,prepare]
    concurrency:
      group: ${{ github.ref }}-sonarcube
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-lcov
          path: coverage

      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_CLOUD_TOKEN }}
